
name: Build FANTA SENSI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FantaSensiAndroid.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q FantaSensiAndroid.zip -d source
          PROJECT_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "Arquivo settings.gradle não encontrado"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle 8.7
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FANTA-SENSI-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
