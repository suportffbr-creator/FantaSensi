
name: Build FANTA SENSI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'FantaSensiAndroid.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "FantaSensiAndroid.zip" ]; then
            echo "ERRO: FantaSensiAndroid.zip não encontrado."
            exit 1
          fi

          mkdir -p source
          unzip -q FantaSensiAndroid.zip -d source

          echo "Arquivos extraídos:"
          ls -la source

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build FANTA SENSI APK
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon assembleDebug

      - name: Locate generated APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find source -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: Nenhum APK foi gerado."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/FantaSensi.apk

          echo "APK_PATH=release/FantaSensi.apk" >> "$GITHUB_ENV"

          echo "APK encontrado: $APK"

      - name: Upload FANTA SENSI APK
        uses: actions/upload-artifact@v4
        with:
          name: FANTA-SENSI-APK
          path: release/FantaSensi.apk
          if-no-files-found: error
          retention-days: 7
